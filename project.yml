name: IMESwitch
options:
  bundleIdPrefix: fan.zeyi
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  IMESwitch:
    type: application
    platform: macOS
    sources:
      - IMESwitch
    info:
      path: IMESwitch/Info.plist
      properties:
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
    # Signing lives in Signing.xcconfig (ad-hoc by default, overridable in a
    # git-ignored Local.xcconfig), since target settings here would win over it.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fan.zeyi.IMESwitch
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Debug is the local dev build: a separate app (bundle ID, name, Accessibility
      # grant, defaults) so it doesn't fight with the installed Developer ID build.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: fan.zeyi.IMESwitch.dev
          PRODUCT_NAME: IMESwitchDev
          PRODUCT_MODULE_NAME: IMESwitch
          APP_DISPLAY_NAME: IMESwitch Dev
        Release:
          PRODUCT_NAME: IMESwitch
          APP_DISPLAY_NAME: IMESwitch
