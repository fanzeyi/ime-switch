name: IMESwitch
options:
  bundleIdPrefix: fan.zeyi
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  IMESwitch:
    type: application
    platform: macOS
    sources:
      - IMESwitch
    info:
      path: IMESwitch/Info.plist
      properties:
        CFBundleName: IMESwitch
        CFBundleDisplayName: IMESwitch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fan.zeyi.IMESwitch
        DEVELOPMENT_TEAM: U75D75QN8A
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
